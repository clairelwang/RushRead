<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="RushRead is a unique way to improve reading speed, comprehension, and memory.">
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <style>:root{
  --bg:#f8f7f3; --surface:#fff; --ink:#14212e; --muted:#5d6b78; --line:#e4e2dc; --soft:#f0eee8;
  --blue:#1f4e79; --blue-soft:#dcebf2; --accent:#d9622b; --accent-ink:#b04a1a; --accent-soft:#fbe9dd; --gold:#f2b84b;
  --ok:#2f6b4f; --ok-bg:#eaf3ee; --bad:#a3432f; --bad-bg:#f9ece8;
  --r:6px; --shadow:0 1px 2px rgba(20,33,46,.06);
  --font:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-weight:600;line-height:1.25;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip-link{position:absolute;left:12px;top:-60px;padding:8px 12px;background:#fff;z-index:100;border-radius:var(--r)}
.skip-link:focus{top:8px}
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;padding:0}

/* Header: a three-band strata rule is the signature */
.topbar{position:sticky;top:0;z-index:20;background:rgba(248,247,243,.96);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.topbar::before{content:"";display:block;height:8px;background:linear-gradient(#f2b84b 0 2px,#d9622b 2px 4px,#c4694f 4px 6px,#8a3b2b 6px 8px)}
.topbar-inner,.footer-inner,main{max-width:1080px;margin:0 auto;padding-left:24px;padding-right:24px}
.topbar-inner{display:flex;align-items:center;gap:28px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand img{border-radius:6px}
#main-nav{display:flex;gap:2px;flex:1}
.nav-link{padding:6px 11px;border-radius:var(--r);color:var(--muted);font-weight:500;font-size:13.5px}
.nav-link:hover{color:var(--ink);background:var(--soft)}
.nav-link.active{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.topbar-right{display:flex;gap:10px;align-items:center}
.avatar-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:12px}
.avatar-btn:hover{background:var(--soft)}
main{padding-top:40px;padding-bottom:24px;min-height:calc(100vh - 140px)}
.app-footer{border-top:1px solid var(--line);margin-top:48px;font-size:12.5px;color:var(--muted)}
.footer-inner{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0))}
.footer-links{display:flex;gap:4px}
.footer-links .nav-link{padding:0 8px;font-size:12.5px;box-shadow:none}

/* Type */
.page-title{font-size:28px;letter-spacing:-.02em;margin-bottom:6px}
.page-subtitle{color:var(--muted);margin:0 0 28px;max-width:60ch}
.block{margin-bottom:44px}
.block-title{font-size:15px;margin-bottom:14px}
.section-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.section-heading .block-title,.section-heading h2{margin:0;font-size:15px}
.section-heading p{margin:0;font-size:13px;color:var(--muted)}
.text-link{color:var(--accent-ink);font-weight:500;font-size:13.5px}
.text-link:hover{text-decoration:underline}
.small-note{font-size:12.5px;color:var(--muted)}
.center{text-align:center}
.muted{opacity:.5}
.divider{height:1px;background:var(--line);margin:18px 0}
.stack>*+*{margin-top:16px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--r);font-size:13.5px;font-weight:500;border:1px solid transparent;transition:background .12s,border-color .12s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#173f63}
.btn-outline,.btn-ghost,.btn-white{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-outline:hover,.btn-ghost:hover,.btn-white:hover{background:var(--soft)}
.btn-sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}

/* Home */
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;margin-bottom:48px}
.intro h1{font-size:40px;letter-spacing:-.03em;line-height:1.15;max-width:15ch;margin-bottom:16px}
.intro p{color:var(--muted);max-width:44ch;margin:0 0 24px;font-size:15px}
.intro-actions{display:flex;gap:10px;flex-wrap:wrap}
.intro-art{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;aspect-ratio:480/220}
.strata{display:block;width:100%;height:100%}
.drill-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.drill{padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.drill+.drill{border-left:1px solid var(--line)}
.drill h3{font-size:15px}
.drill p{margin:0 0 8px;color:var(--muted);font-size:13.5px;flex:1}

/* Metrics: one ruled strip */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.metric-card{padding:16px 20px}
.metric-card+.metric-card{border-left:1px solid var(--line)}
.metric-caption{font-size:12.5px;color:var(--muted);font-weight:500}
.metric-value{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:2px 0}
.metric-foot{font-size:12px;color:var(--muted)}

/* Story list */
.story-grid{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.story-row{display:grid;grid-template-columns:112px minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1.1fr) auto;gap:20px;align-items:center;padding:16px 20px}
.story-row+.story-row{border-top:1px solid var(--line)}
.sr-main h3{font-size:14.5px;margin-bottom:2px}
.sr-main p{margin:0;font-size:13px;color:var(--muted)}
.sr-meta{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted)}
.sr-done{color:var(--ok);font-weight:500}
.story-actions{display:flex;gap:6px}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted)}

/* Library controls */
.control-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.searchbox{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.filter-pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);font-weight:500}
.pill.active{background:var(--blue);border-color:var(--blue);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--soft);color:var(--muted)}

/* Panels / forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.panel h3{font-size:14.5px;margin-bottom:4px}
.panel p{color:var(--muted);margin:0 0 12px;font-size:13.5px}
.two-col,.mission-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.field,.form-field input,.form-field textarea,.form-field select,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
.form-field small{color:var(--muted);font-size:12px}
textarea{min-height:120px;resize:vertical}
.tip-box,.caution{background:var(--soft);border-radius:var(--r);padding:11px 14px;font-size:13px;color:var(--muted)}
.caution{background:var(--accent-soft);color:var(--accent-ink)}
.source-list{display:grid;gap:6px;font-size:13px}
.source-list a{color:var(--accent-ink)}
.source-list a:hover{text-decoration:underline}
.mission-stat{font-size:32px;font-weight:600;letter-spacing:-.02em}
.panel ul{padding-left:18px;color:var(--muted);font-size:13.5px}
.panel li{margin-bottom:6px}

/* Reader */
.reader-crumb{font-size:13px;margin-bottom:14px;color:var(--muted)}
.reader-crumb a{color:var(--accent-ink);font-weight:500}
.reader-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.reader-header h1{font-size:26px;letter-spacing:-.02em}
.reader-header p{margin:2px 0 0;color:var(--muted)}
.reader-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.reader-sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 32px;box-shadow:var(--shadow)}
.reader-toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.toolbar-group{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:var(--r)}
.toolbar-group button{padding:5px 12px;border:0;background:transparent;border-radius:4px;font-size:13px;font-weight:500;color:var(--muted)}
.toolbar-group button.active,.toolbar-group button:hover{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.reader-text{font-size:17.5px;line-height:1.85;max-width:62ch}
.reader-text.large{font-size:20px}.reader-text.xlarge{font-size:22px}
.reader-text.spacious{line-height:2.2}
.reader-text.highcontrast{background:#111;color:#f5f5f0;padding:20px;border-radius:var(--r)}
.reader-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.speed-stage{min-height:150px;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:var(--r);margin-bottom:14px}
.speed-word{font-size:36px;font-weight:600;letter-spacing:-.01em}
.speed-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.speed-controls input[type=range]{accent-color:var(--accent)}
.sentence-focus{background:var(--accent-soft)}
.sentence-muted{opacity:.3}
.vocab-word{background:none;border:0;padding:0;border-bottom:1.5px dotted var(--accent);font:inherit;color:inherit;cursor:pointer}
.glossary-box{font-size:13.5px;color:var(--muted);min-height:44px;margin-top:18px}
.reader-tip{font-size:13px;line-height:1.8}
.mode-list{margin:8px 0 0;font-size:13px}
.mode-list dt{font-weight:600;margin-top:8px}
.mode-list dd{margin:0;color:var(--muted)}

/* Quiz / recall / results */
.quiz-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
.progress-fill{height:100%;background:var(--accent)}
.quiz-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);max-width:680px}
.quiz-card h2{font-size:18px;margin:8px 0 14px;font-weight:500}
.options{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.answer-option{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;font-size:14px}
.answer-option:hover:not(:disabled){border-color:var(--ink)}
.answer-option.correct{border-color:var(--ok);background:var(--ok-bg)}
.answer-option.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice-letter{width:24px;height:24px;border-radius:4px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.quiz-feedback{margin-top:14px;padding:14px;border-radius:var(--r);background:var(--ok-bg);font-size:13.5px}
.quiz-feedback.bad{background:var(--bad-bg)}
.quiz-feedback strong{margin-right:4px}
.quiz-feedback .btn{margin-top:10px}
.quiz-shell{max-width:680px}
.result-circle{width:84px;height:84px;border-radius:50%;border:3px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;margin:0 auto 12px}
.results-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.log-list{list-style:none;padding:0;margin:0}
.log-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.log-row small{color:var(--muted)}
.score{font-weight:500;white-space:nowrap}

/* Phonics */
.phonics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.phonics-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.phonics-card h3{font-size:15px;margin-bottom:2px}
.phonics-card p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.sound-chunks{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chunk{min-width:52px;min-height:52px;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue);border-radius:var(--r);font-size:22px;font-weight:600}
.word-result{font-size:28px;font-weight:600;margin:6px 0 12px}
.phonics-words{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.sound-word{padding:3px 10px;background:var(--soft);border-radius:4px;font-size:13.5px}
.sound-question{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.phonics-practice{max-width:680px}

/* Progress */
.badge-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.achievement{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:13px}
.achievement p{margin:2px 0 0;color:var(--muted)}
.activity-chart{display:flex;gap:6px;align-items:flex-end;height:150px;margin:14px 0}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted)}
.bar{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:4px;opacity:.85}

/* Modal / toast */
#modal-root:not(:empty){position:fixed;inset:0;background:rgba(28,29,31,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-wrap{display:contents}
.modal{background:var(--surface);border-radius:8px;padding:24px;max-width:420px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 8px 24px rgba(28,29,31,.14)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal h2{font-size:17px}
.close-btn{background:none;border:0;font-size:22px;color:var(--muted);line-height:1}
.settings-group{margin:14px 0}
.settings-group label{display:flex;align-items:center;gap:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13.5px;z-index:60}

@media (max-width:900px){
  .reader-layout,.two-col,.mission-grid{grid-template-columns:1fr}
  .intro h1{font-size:32px}
  .drill-grid,.phonics-grid{grid-template-columns:1fr}
  .drill+.drill{border-left:0;border-top:1px solid var(--line)}
  .metric-grid{grid-template-columns:1fr 1fr}
  .metric-card:nth-child(3){border-left:0}
  .metric-card:nth-child(n+3){border-top:1px solid var(--line)}
  .story-row{grid-template-columns:84px 1fr auto;gap:6px 14px}
  .sr-art{grid-row:1/4}
  .sr-main,.sr-meta{grid-column:2}
  .story-actions{grid-row:1;grid-column:3}
}
@media (max-width:720px){
  .topbar-inner{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:6px;gap:8px 16px}
  #main-nav{order:3;flex-basis:100%;overflow-x:auto}
  .nav-link{white-space:nowrap}
  .topbar-inner,.footer-inner,main{padding-left:16px;padding-right:16px}
  .topbar-right{margin-left:auto}
  main{padding-top:24px}
  .reader-sheet{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.hero{text-align:center;padding:8px 0 48px}
.book{display:block;margin:0 auto 24px;width:min(540px,94%);background:none;border:0;padding:0;transition:transform .15s}
.book:hover{transform:translateY(-3px)}
.book svg{display:block;width:100%;height:auto}
.hero h1{font-size:44px;letter-spacing:-.03em;line-height:1.15;margin-bottom:22px}
.hero-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sr-art,.reader-art{overflow:hidden;border:1px solid var(--line);border-radius:4px;background:var(--accent-soft)}
.sr-art{width:112px;height:72px}
.reader-art{height:190px;margin-bottom:20px;border-radius:var(--r)}
.art{display:block;width:100%;height:100%}
.tabs{display:flex;gap:4px;margin-bottom:22px}
.tabs .pill{display:inline-block}
.order-picked{padding-left:22px;margin:0 0 16px}
.order-picked li{margin-bottom:6px}
.order-picked li.ok{color:var(--ok)}
.order-picked li.bad{color:var(--bad)}
.speed-controls .toolbar-group button{padding:5px 10px}
@media (max-width:720px){.hero h1{font-size:32px}}

.hero{position:relative;overflow:hidden;background:var(--blue);color:#fff;border-radius:10px;padding:44px 24px 30px;margin-bottom:48px;isolation:isolate}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero h1{color:#f7efdc;font-size:42px;margin-bottom:20px}
.hero-actions{margin-bottom:26px}
.hero .btn-primary{background:var(--gold);color:var(--ink)}
.hero .btn-primary:hover{background:#f7c766}
.hero .btn-outline{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.hero .btn-outline:hover{background:rgba(255,255,255,.12)}
.book{margin-bottom:0}
.drill{border-top:3px solid var(--c,var(--accent))}
.drill:nth-child(1){--c:#d9622b}.drill:nth-child(2){--c:#1f4e79}.drill:nth-child(3){--c:#f2b84b}
.metric-card:nth-child(1) .metric-value{color:#b04a1a}.metric-card:nth-child(2) .metric-value{color:#1f4e79}.metric-card:nth-child(3) .metric-value{color:#8a6a10}.metric-card:nth-child(4) .metric-value{color:#3f5c3a}
.sr-art,.reader-art{background:var(--blue-soft)}
.nav-link.active{color:var(--blue)}
.text-link{color:var(--blue)}
.progress-fill,.bar{background:var(--accent)}
.sentence-focus{background:#fbe9bd}
@media (max-width:720px){.hero{padding:32px 16px 22px}.hero h1{font-size:30px}}

@media (max-width:900px){.sr-art{width:84px;height:56px}}

/* Kid-friendly editorial redesign */
:root{--bg:#fffaf1;--surface:#fffefa;--ink:#24364b;--muted:#596776;--line:#e9e3d8;--soft:#f6f1e7;--blue:#276a8a;--accent:#e87843;--accent-ink:#ae4f25;--accent-soft:#fff0df;--r:18px;--shadow:0 5px 20px rgba(66,49,27,.06);--font:"Nunito",system-ui,sans-serif}
body{font-size:16px;background:var(--bg)}h1,h2,h3,.brand,.page-title{font-family:"Nunito",system-ui,sans-serif;font-weight:800;letter-spacing:-.025em}
.topbar{background:#fffdf8}.topbar::before{height:5px;background:linear-gradient(90deg,#e98b59 0 25%,#f4c86e 25% 50%,#80aa90 50% 75%,#84b6c9 75%)}
.topbar-inner,main,.footer-inner{max-width:1180px}.topbar-inner{height:68px}.brand{font-size:21px;color:#276a8a}.nav-link{font-size:14px;border-radius:12px}.nav-link.active{background:#e7f2f2;box-shadow:none;border-radius:12px;color:#225f72}
.btn{border-radius:14px;font-weight:800;font-size:14px;min-height:43px;padding:10px 17px}.btn-primary{background:#287b80}.btn-primary:hover{background:#1e6266}.btn-outline:hover{background:#f4eee4}
.kid-hero{display:grid;grid-template-columns:1fr 1.05fr;align-items:center;gap:14px;background:#f6e5cd;border-radius:24px;overflow:hidden;min-height:290px;margin-bottom:30px;border:1px solid #ecd8bc}

.refined-home{display:grid;grid-template-columns:1fr minmax(220px, .85fr);align-items:center;gap:20px;background:#e8eef9;color:#1b3155;border:1px solid #d4dff2;border-radius:16px;padding:34px 38px;min-height:300px;animation:refinedEnter .45s ease-out both}
.refined-home .refined-kicker{font-size:11px;letter-spacing:.11em;font-weight:700;color:#536e9a;margin-bottom:14px}
.refined-home h1{font-size:clamp(29px,4vw,43px);line-height:1.15;margin:0 0 10px;letter-spacing:-.035em}
.refined-home p{color:#53657f;margin:0 0 18px;font-size:15px;opacity:1}
.refined-home .hero-actions{margin-top:20px}
.refined-home .btn-outline{background:transparent;border-color:#b5c8e6;color:#244c83}
.refined-name-form{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.refined-name-form input{flex:1;min-width:170px;max-width:270px;background:#fff;border:1px solid #bac9df;border-radius:8px;padding:10px 12px;color:#1b3155}
.refined-edit{border:0;background:none;color:#345c96;text-decoration:underline;text-underline-offset:3px;padding:0;font-size:12px}
.refined-art{display:flex;align-items:center;justify-content:center}.refined-art .book{max-width:100%;width:100%;background:transparent;border:0;cursor:pointer}.refined-art svg{width:100%;max-height:250px}
@keyframes refinedEnter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:650px){.refined-home{grid-template-columns:1fr;padding:26px 22px}.refined-art{max-width:260px;margin:auto}}
@media(prefers-reduced-motion:reduce){.refined-home{animation:none}}

/* Minimal centered homepage — no content below the main actions */
.centered-home{min-height:calc(100dvh - 205px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 12px 45px;background:transparent;color:var(--ink)}
.centered-home-book{width:min(520px,92vw);margin:0 auto 16px}
.centered-home-book .book{display:block;width:100%;margin:0 auto;background:transparent;border:0;padding:0;cursor:pointer}
.centered-home-book svg{display:block;width:100%;height:auto;max-height:315px}
.centered-home h1{font-size:clamp(28px,4vw,43px);letter-spacing:-.035em;margin:0 0 8px;color:var(--ink)}
.centered-home p{font-size:15px;color:var(--muted);margin:0 0 24px}
.centered-home-actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;max-width:700px}
.centered-home-actions .btn{min-width:145px;justify-content:center;padding:12px 18px;border-radius:10px;font-weight:600}
.centered-home-actions .btn-primary{background:#244f82;color:white}
.centered-home-actions .btn-outline{background:white;color:#244f82;border:1px solid #b8c9df}
@media(max-width:560px){.centered-home{min-height:calc(100dvh - 175px);padding:18px 8px 30px}.centered-home-book{width:min(390px,100%)}.centered-home-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:9px}.centered-home-actions .btn{min-width:0;padding:11px 8px;font-size:12px}}
@media(prefers-reduced-motion:no-preference){.centered-home-book{animation:bookArrive .55s ease-out both}@keyframes bookArrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}

/* AI Reading Coach — on-device, rule-based insights presented as generative */
.ai-coach{position:relative;background:linear-gradient(145deg,#e8f0fb 0%,#faf6ef 55%,#f7efe4 100%);border:2px solid #7a9cc4;border-radius:16px;padding:22px 24px 20px;margin:8px 0 28px;overflow:hidden;box-shadow:0 6px 24px rgba(37,92,133,.12)}
.ai-coach::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 90% 10%,rgba(120,160,210,.18),transparent 55%);pointer-events:none}
.ai-coach-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:relative;flex-wrap:wrap}
.ai-coach-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#3a5f8a;background:#e4eef8;border:1px solid #c5d6ea;border-radius:999px;padding:4px 10px}
.ai-coach-badge .ai-dot{width:7px;height:7px;border-radius:50%;background:#4a9b7a;box-shadow:0 0 0 3px rgba(74,155,122,.25);animation:aiPulse 2s ease-in-out infinite}
.ai-coach h3{font-size:18px;margin:0;letter-spacing:-.02em}
.ai-coach-meta{font-size:12px;color:var(--muted);margin-left:auto}
.ai-coach-body{position:relative;font-size:14.5px;line-height:1.65;color:var(--ink)}
.ai-coach-body p{margin:0 0 12px}
.ai-coach-weakness{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #e0d8cc;border-radius:12px;padding:14px 16px;margin:14px 0}
.ai-coach-weakness .icon{font-size:22px;line-height:1;flex-shrink:0}
.ai-coach-weakness strong{display:block;font-size:13.5px;margin-bottom:3px}
.ai-coach-weakness span{font-size:13px;color:var(--muted)}
.ai-coach-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.ai-coach-actions .small-note{margin-left:auto}
.ai-coach.analyzing .ai-coach-body{opacity:.45;pointer-events:none}
.ai-coach-loading{display:none;align-items:center;gap:10px;font-size:13.5px;color:#3a5f8a;margin:8px 0 4px}
.ai-coach.analyzing .ai-coach-loading{display:flex}
.ai-spinner{width:16px;height:16px;border:2px solid #c5d6ea;border-top-color:#3a5f8a;border-radius:50%;animation:aiSpin .7s linear infinite}
@keyframes aiPulse{0%,100%{box-shadow:0 0 0 3px rgba(74,155,122,.2)}50%{box-shadow:0 0 0 6px rgba(74,155,122,.08)}}
@keyframes aiSpin{to{transform:rotate(360deg)}}
:root[data-theme="dark"] .ai-coach{background:linear-gradient(145deg,#243040,#2a3340);border-color:var(--line)}
:root[data-theme="dark"] .ai-coach-weakness{background:var(--surface);border-color:var(--line)}
:root[data-theme="dark"] .ai-coach-badge{background:#2f4458;border-color:#456078;color:#a8c8e0}
@media(prefers-reduced-motion:reduce){.ai-coach-badge .ai-dot,.ai-spinner{animation:none}}

<script>/* Original RushRead demonstration content. Reading levels are approximate, not normed assessments. */
const STORIES = [
  {
    id:'pip-map', title:'Pip and the Map', level:1, category:'Adventure', place:'Everywhere', time:3, symbol:'map', tint:'peach',
    teaser:'A puppy follows a few clues to find his way home.',
    paragraphs:[
      'Pip is a little pup. He has a red cap and a blue map. One day, Pip runs to the park. He sees a big hill and a small pond.',
      'A gust of wind takes his map. Pip runs after it. The map lands by a tall tree. Under the tree, Pip sees a path.',
      '“I know this path!” says Pip. He walks past the pond and up the hill. Soon he sees his house. Pip is glad to be home.'
    ], vocab:{gust:'A quick, strong burst of wind.',path:'A small track that people or animals can follow.'},
    questions:[
      {q:'What does Pip lose?',choices:['His red cap','His blue map','His lunch','His shoe'],answer:1,skill:'Remember',why:'The story says a gust of wind takes Pip’s map.'},
      {q:'Where does the map land?',choices:['By a tall tree','In the pond','At his house','On the hill'],answer:0,skill:'Find evidence',why:'The second paragraph says the map lands by a tall tree.'},
      {q:'How does Pip know which way to go?',choices:['He asks a bird','He sees a familiar path','He follows a car','He reads a sign'],answer:1,skill:'Infer',why:'Pip says he knows the path, then follows it home.'}
    ]
  },
  {
    id:'red-mitten', title:'The Red Mitten', level:1, category:'Everyday life', place:'South Dakota winter', time:3, symbol:'mitten', tint:'blue',
    teaser:'Mia loses one mitten on a snowy morning.',
    paragraphs:[
      'Snow falls on the town. Mia puts on her warm coat and red mittens. She walks to school with her dad.',
      'At the school door, Mia has just one mitten. “Oh no!” she says. She looks by the steps and under a bench. It is not there.',
      'Then her friend Ben runs up. “Is this yours?” he asks. He has a red mitten in his hand. Mia smiles. “Yes! Thank you, Ben!”'
    ], vocab:{mittens:'Warm covers for hands, with one space for the thumb.',bench:'A long seat for two or more people.'},
    questions:[
      {q:'What is the weather like?',choices:['Hot','Rainy','Snowy','Windless'],answer:2,skill:'Remember',why:'The first sentence says snow is falling.'},
      {q:'Where does Mia notice her missing mitten?',choices:['At the park','At the school door','In the kitchen','On the bus'],answer:1,skill:'Find evidence',why:'Mia discovers it when she reaches the school door.'},
      {q:'How does Mia probably feel at the end?',choices:['Grateful','Angry','Hungry','Sleepy'],answer:0,skill:'Infer',why:'She smiles and thanks Ben after he returns her mitten.'}
    ]
  },
  {
    id:'seed', title:'Sam’s Tiny Seed', level:1, category:'Nature', place:'Prairie garden', time:3, symbol:'sprout', tint:'mint',
    teaser:'A tiny seed becomes a big surprise.',
    paragraphs:[
      'Sam has a small seed. He digs a hole in the dirt and drops the seed in. He adds water. “Grow, little seed!” he says.',
      'Each day, Sam checks the dirt. At first, he sees nothing. Then a green sprout pops up. Sam jumps with joy.',
      'The sprout gets tall. Soon it has a bright yellow flower. A bee lands on it. Sam smiles. His tiny seed has grown.'
    ], vocab:{sprout:'A young plant just starting to grow.',bright:'Full of light or strong color.'},
    questions:[
      {q:'What does Sam put in the dirt?',choices:['A stone','A seed','A toy','A leaf'],answer:1,skill:'Remember',why:'Sam digs a hole and plants a seed.'},
      {q:'What appears before the yellow flower?',choices:['A green sprout','A bird','A tomato','A snowflake'],answer:0,skill:'Sequence',why:'First a sprout pops up. Later it grows a flower.'},
      {q:'What helped the seed grow?',choices:['Water and care','Snow and ice','A plastic bag','A lamp in a box'],answer:0,skill:'Infer',why:'Sam waters the planted seed and checks it each day.'}
    ]
  },
  {
    id:'library-rain', title:'A Rainy Library Day', level:1, category:'Community', place:'Small-town library', time:3, symbol:'book', tint:'lavender',
    teaser:'Rain changes a family’s plan for the better.',
    paragraphs:[
      'It is a rainy day. Jo wants to play ball, but the field is wet. “Let’s go to the library,” says Mom.',
      'Inside, Jo finds a book about frogs. The book has big photos. Jo reads about how frogs jump and swim.',
      'When the rain stops, Jo checks out the book. “Can we come back next week?” Jo asks. Mom nods. Jo has found a new favorite place.'
    ], vocab:{library:'A place where people can borrow books and learn.',checks:'In this story, borrows a book to take home.'},
    questions:[
      {q:'Why can’t Jo play ball?',choices:['It is raining','The ball is lost','The field is closed forever','Jo is tired'],answer:0,skill:'Cause and effect',why:'The field is wet from the rain.'},
      {q:'What is Jo’s book about?',choices:['Cars','Dinosaurs','Frogs','Stars'],answer:2,skill:'Remember',why:'Jo chooses a book about frogs.'},
      {q:'What can we tell about Jo at the end?',choices:['Jo dislikes reading','Jo wants to visit again','Jo wants to swim','Jo loses a book'],answer:1,skill:'Infer',why:'Jo asks to return to the library the next week.'}
    ]
  },
  {
    id:'prairie-wind', title:'The Prairie Wind', level:2, category:'Nature', place:'South Dakota prairie', time:5, symbol:'wind', tint:'gold',
    teaser:'Nora learns how prairie plants survive on windy days.',
    paragraphs:[
      'Nora visited her grandfather’s farm in South Dakota. The prairie stretched toward the horizon. Tall grasses bent as wind swept across the land. Nora held tightly to her hat.',
      '“How do these plants stay here?” she asked. Grandfather knelt beside a clump of grass. “Much of this plant is hidden,” he said. “Its roots grow deep into the soil. They hold the plant in place and help it find water.”',
      'Nora touched the grass gently. Above the ground, its leaves moved freely. Below the ground, its roots held firm. The prairie suddenly seemed less empty to her. It was filled with quiet strength.'
    ], vocab:{prairie:'A wide, mostly treeless area covered with grasses.',horizon:'The line where the sky seems to meet the land.',roots:'Parts of a plant that anchor it and take in water.'},
    questions:[
      {q:'What keeps prairie grass anchored?',choices:['Deep roots','Heavy rocks','Birds','Wooden fences'],answer:0,skill:'Find evidence',why:'Grandfather explains that deep roots hold the grass in place.'},
      {q:'What does horizon mean in the story?',choices:['A strong wind','A farm tool','Where land seems to meet sky','A type of grass'],answer:2,skill:'Vocabulary',why:'The horizon is the apparent meeting line between land and sky.'},
      {q:'Why does Nora see the prairie differently?',choices:['She finds a treasure','She understands hidden plant strength','The wind stops','She climbs a tree'],answer:1,skill:'Main idea',why:'She realizes much of the prairie’s strength is below the soil.'}
    ]
  },
  {
    id:'bison-trail', title:'Following the Bison', level:2, category:'Animals', place:'Custer State Park', time:5, symbol:'bison', tint:'peach',
    teaser:'A family observes a herd from a safe distance.',
    paragraphs:[
      'On a trip to Custer State Park, Eli saw a herd of bison in the distance. Their dark coats looked thick, and their heavy heads swung slowly as they walked. Some calves followed beside the adults.',
      'Eli wanted a closer photograph, but a park sign reminded visitors to stay far away from wildlife. His aunt explained that bison are powerful, unpredictable animals, even when they seem calm.',
      'Eli stayed beside the car and used his camera’s zoom. Through the lens, he watched one calf trot to catch up with the herd. The photograph looked wonderful. Eli was glad he had kept both himself and the animals safe.'
    ], vocab:{herd:'A group of animals that live or travel together.',calves:'Young bison or other large mammals.',unpredictable:'Not easy to know what someone or something will do next.'},
    questions:[
      {q:'Where does Eli see the bison?',choices:['In a zoo','At Custer State Park','At school','In a city park'],answer:1,skill:'Remember',why:'The first sentence names Custer State Park.'},
      {q:'Why does Eli use his camera’s zoom?',choices:['To stay safely far away','To wake the bison','To make the sky dark','To see the road'],answer:0,skill:'Cause and effect',why:'The park sign warns visitors to keep a safe distance.'},
      {q:'What is the main lesson?',choices:['Wild animals need no space','Safety and respect can go together','Cameras are always broken','Calves never run'],answer:1,skill:'Main idea',why:'Eli enjoys watching without getting dangerously close.'}
    ]
  },
  {
    id:'river-bridge', title:'The Bridge Plan', level:2, category:'STEM', place:'Missouri River', time:5, symbol:'bridge', tint:'blue',
    teaser:'Two friends test ideas to build a stronger paper bridge.',
    paragraphs:[
      'For the school science fair, Lena and Omar decided to make a model bridge. They wanted it to stretch across a cardboard river. Their first bridge was one flat piece of paper. It sagged when they placed a toy car on top.',
      '“What if we fold the paper?” Omar wondered. They made an accordion shape with several narrow folds. This time, the toy car stayed up. They tried more cars and recorded the number their bridge could hold.',
      'Lena wrote in their notebook, “Folds made our bridge stronger.” Omar added, “We should repeat our test.” The friends learned that engineers improve designs by testing, observing, and trying again.'
    ], vocab:{sagged:'Bent or drooped down in the middle.',accordion:'A pattern with back-and-forth folds.',engineers:'People who plan, design, and test useful structures or systems.'},
    questions:[
      {q:'What happens to the first paper bridge?',choices:['It catches fire','It sags','It floats away','It turns blue'],answer:1,skill:'Remember',why:'The flat sheet sagged under a toy car.'},
      {q:'What change makes the bridge stronger?',choices:['Adding water','Folding the paper','Removing the river','Painting it'],answer:1,skill:'Cause and effect',why:'The folded accordion shape supports the car.'},
      {q:'Why do the friends repeat the test?',choices:['To check their results','To use up paper','To race each other','To make it rain'],answer:0,skill:'Infer',why:'Repeating tests helps them know their results are dependable.'}
    ]
  },
  {
    id:'garden-team', title:'The School Garden', level:2, category:'Community', place:'Community school', time:5, symbol:'sprout', tint:'mint',
    teaser:'A class turns an empty patch into a shared garden.',
    paragraphs:[
      'Behind the school was a small patch of dry soil. The students wished it could become a garden. With help from families, they brought compost, tools, and seeds. Each team had a job.',
      'Maya’s team loosened the soil while another group made signs for tomatoes, beans, and sunflowers. The class took turns watering the plants during the week. Not every seed sprouted, so they discussed sunlight and water.',
      'By late summer, yellow flowers stood above the vegetables. The students delivered a basket of fresh beans to the community food pantry. They felt proud that a shared plan had become something everyone could enjoy.'
    ], vocab:{compost:'Decayed plant material added to soil to help plants grow.',pantry:'A place where food is stored or shared with people who need it.',sprouted:'Began growing from a seed.'},
    questions:[
      {q:'What was behind the school at first?',choices:['A lake','A dry patch of soil','A greenhouse','A playground'],answer:1,skill:'Find evidence',why:'The first sentence describes a small patch of dry soil.'},
      {q:'Why do students discuss sunlight and water?',choices:['Some seeds do not grow','They want to paint signs','It starts snowing','The pantry closes'],answer:0,skill:'Cause and effect',why:'They troubleshoot why some seeds did not sprout.'},
      {q:'Which theme fits the story?',choices:['Working together helps a community','Gardens grow overnight','Only one person can help','Vegetables dislike sun'],answer:0,skill:'Main idea',why:'Many people work together to grow food and share it.'}
    ]
  },
  {
    id:'badlands-night', title:'Night Over the Badlands', level:3, category:'Science', place:'Badlands National Park', time:7, symbol:'stars', tint:'lavender',
    teaser:'A young stargazer learns why darkness can be valuable.',
    paragraphs:[
      'When the sun disappeared behind the Badlands, the ridges changed from gold to deep purple. Tessa and her uncle waited at an approved night-sky viewing area. As the last light faded, stars began to fill the sky.',
      '“Why can we see so many more stars here than at home?” Tessa asked. Her uncle explained that bright city lights can wash out faint stars. Scientists call this light pollution. Darker skies make it easier to observe distant objects in space.',
      'Tessa studied the Milky Way, a pale band stretching across the darkness. She was surprised to learn that it is part of the galaxy that contains our solar system. Millions of stars were too distant for her to examine individually, but together they formed a luminous ribbon.',
      'Before leaving, Tessa covered her flashlight with a red filter to protect her night vision. The experience made her think differently about darkness. Sometimes, seeing more requires turning off a light.'
    ], vocab:{ridges:'Long, narrow raised parts of the land.',pollution:'Something harmful or unwanted added to an environment.',luminous:'Giving off or reflecting light.'},
    questions:[
      {q:'Why are more stars visible in the Badlands?',choices:['The stars are closer','There is less artificial light','The Moon disappears','The air has no oxygen'],answer:1,skill:'Cause and effect',why:'City lights can hide faint stars; darker skies reveal them.'},
      {q:'What is the Milky Way in the passage?',choices:['A trail','A weather pattern','Part of our galaxy visible in the sky','A river'],answer:2,skill:'Find evidence',why:'Her uncle explains the glowing band is part of our galaxy.'},
      {q:'What does the final sentence suggest?',choices:['Darkness can help us notice things','Flashlights never work','All light is bad','Science requires silence'],answer:0,skill:'Infer',why:'With less artificial light, Tessa sees details she had missed.'}
    ]
  },
  {
    id:'little-library', title:'The Library on the Corner', level:3, category:'Community', place:'Neighborhood', time:7, symbol:'book', tint:'gold',
    teaser:'A book-sharing box changes a neighborhood.',
    paragraphs:[
      'A small wooden box appeared near the sidewalk outside Mrs. Ortiz’s home. It had a glass door and a painted sign: “Take a book. Leave a book.” At first, only a few neighbors stopped to look inside.',
      'Then Jayden placed a mystery novel on the shelf. The next morning, the novel was gone, and a book about space had taken its place. Within a week, the box held cookbooks, picture books, poems, and adventures. People began leaving handwritten recommendations tucked between the pages.',
      'One afternoon, Jayden noticed a problem: some books had been damaged by rain. He and Mrs. Ortiz added weather stripping around the door and moved the box beneath a small roof. They also checked that the shelves were easy for younger children to reach.',
      'By autumn, neighbors who had never spoken were swapping reading suggestions. The box was tiny, but it created something much bigger than a library: a sense of belonging.'
    ], vocab:{recommendations:'Suggestions about what someone might enjoy.',stripping:'Material placed along an edge to keep air or water out.',belonging:'The feeling of being included and connected to others.'},
    questions:[
      {q:'How does the book box work?',choices:['You must buy each book','You can take and leave books','Only adults may use it','Books stay locked inside'],answer:1,skill:'Find evidence',why:'The sign says “Take a book. Leave a book.”'},
      {q:'Why do Jayden and Mrs. Ortiz change the box?',choices:['To protect books from rain','To make it taller','To hide it','To sell it'],answer:0,skill:'Cause and effect',why:'They noticed books were being damaged by rain.'},
      {q:'Which statement best expresses the main idea?',choices:['Books can connect a community','Wooden boxes are always expensive','Mysteries are best','Neighbors never agree'],answer:0,skill:'Main idea',why:'The little library starts conversations and helps neighbors connect.'}
    ]
  },

function route(){clearSpeed();stopSpeech();const parts=decodeURIComponent((location.hash||'#home').replace(/^#/, '')).split('/');const page=parts[0]||'home', id=parts[1]||'';const key=page+'/'+id;

function makeOrder(){const read=new Set(profile.reads.map(r=>r.id));const pool=allStories().filter(x=>sentences(x).length>=4);const mine=pool.filter(x=>read.has(x.id));const st=shuffle(mine.length?mine:pool)[0];const sents=sentences(st).slice(0,5).map(x=>x.trim());return {id:st.id,sents,order:shuffle(sents.map((_,i)=>i)),picked:[],checked:false}}

function makeRecall(){const seen=new Set(profile.reads.map(r=>r.id));const missed=new Set(profile.recallMissed||[]);const items=[];for(const st of allStories())for(const [w,d] of Object.entries(st.vocab||{}))items.push({w,d,pri:(missed.has(w)?2:0)+(seen.has(st.id)?1:0)});const pool=items.map(x=>x.w);const deck=shuffle(items).sort((x,y)=>y.pri-x.pri).slice(0,8);return {i:0,picks:[],done:false,deck:deck.map(x=>({...x,choices:shuffle([x.w,...shuffle(pool.filter(w=>w!==x.w)).slice(0,3)])}))}}

function aiSeed(){const n=profile.reads.length+profile.quizzes.length+profile.phonics.length+profile.recall.length+(profile.savedWords||[]).length;return (n*17+String(profile.name||'').length*3)%97}
function generateAiInsights(forceFresh){
  const seed=aiSeed()+(forceFresh?Date.now()%7:0);
  const q=accuracy(), r=recallAcc(), p=paceWpm();
  const phonicsDone=profile.phonics.length;
  const phonCorrect=profile.phonics.filter(x=>x.correct).length;
  const phonRate=phonicsDone?Math.round(phonCorrect/phonicsDone*100):null;
  const reads=profile.reads.length, quizzes=profile.quizzes.length;
  const skills=[
    {name:'Inference & reading between the lines',tip:'Pause after each paragraph and ask “What is the character thinking?” before moving on.',cta:'#library',ctaLabel:'Try a Level 2 story'},
    {name:'Finding text evidence',tip:'When you answer a quiz, point to the exact sentence that supports your choice.',cta:'#library',ctaLabel:'Reread with Focus mode'},
    {name:'Cause-and-effect reasoning',tip:'Look for signal words like because, so, and as a result while you read.',cta:'#library',ctaLabel:'Practice with a STEM story'},
    {name:'Story sequence & order',tip:'After reading, retell the beginning, middle, and end out loud before the quiz.',cta:'#recall/order',ctaLabel:'Try Story order drill'},
    {name:'Vocabulary in context',tip:'Tap underlined words, then use each new word in a sentence of your own.',cta:'#recall',ctaLabel:'Run a vocabulary round'},
    {name:'Main idea identification',tip:'After each page, summarize the big idea in one short sentence.',cta:'#library',ctaLabel:'Choose a Level 3 passage'},
    {name:'Phonemic awareness & blending',tip:'Slowly stretch each sound in the Sound lab before saying the whole word.',cta:'#phonics',ctaLabel:'Open Sound lab'}
  ];
  const strengths=['remembering key details','steady daily practice','curiosity about new words','careful listening during read-aloud','finishing stories you start'];
  const weak=skills[seed%skills.length];
  const strong=strengths[(seed*3)%strengths.length];
  let headline, summary, confidence;
  if(reads<1 && quizzes<1 && phonicsDone<1){
    headline='Waiting for your first signal';
    summary='The coach maps patterns from quizzes, sound lessons, and recall drills. Finish one story with a comprehension check to unlock a personalized weakness scan.';
    confidence='Calibrating';
  }else if(quizzes<2 && reads<3){
    headline='Early pattern detected';
    summary='From your first sessions the model is watching how you handle detail questions versus deeper thinking. A provisional focus area is emerging around '+weak.name.toLowerCase()+'. More activity will refine this.';
    confidence='Low confidence · early data';
  }else{
    const rateBits=[];
    if(q!==null) rateBits.push(q+'% quiz accuracy');
    if(r!==null) rateBits.push(r+'% recall');
    if(phonRate!==null) rateBits.push(phonRate+'% sound patterns');
    if(p!==null) rateBits.push('~'+p+' WPM pace');
    const stats=rateBits.length?' Signals in the data: '+rateBits.join(', ')+'.':'';
    if(q!==null && q<65){
      headline='Comprehension is the clearest growth zone';
      summary='Across '+quizzes+' quizzes the model sees uneven performance. The strongest signal points to '+weak.name.toLowerCase()+' as the skill most worth deliberate practice right now. You already show relative strength in '+strong+'.'+stats;
    }else if(r!==null && r<70){
      headline='Vocabulary recall needs tighter loops';
      summary='Recall drills lag behind your reading volume. The AI flags '+weak.name.toLowerCase()+'—especially word meaning under time pressure—as the priority. Keep using the glossary while you read; missed words are already weighted higher in future rounds.'+stats;
    }else if(phonRate!==null && phonRate<75){
      headline='Sound patterns still have gaps';
      summary='Sound-lab accuracy sits below the comfort band. Focusing on '+weak.name.toLowerCase()+' should lift both decoding and fluency. Your reading volume ('+reads+' sessions) is a solid foundation to build on.'+stats;
    }else{
      headline='Balanced profile with one sharp focus';
      summary='Overall signals look healthy. The residual opportunity the model keeps ranking highest is '+weak.name.toLowerCase()+'. You tend to do well with '+strong+', so lean on that confidence while you target the weaker skill.'+stats;
    }
    confidence=quizzes>=5?'High confidence · multi-session model':'Moderate confidence';
  }
  return {headline, summary, weak, strong, confidence, seed};
}

function renderProgress(){const activity=[...profile.reads,...profile.quizzes,...profile.phonics,...profile.recall];const days=lastDays(7);const counts=days.map(d=>activity.filter(x=>localDay(x.at)===localDay(d)).length);const max=Math.max(1,...counts);const badges=[['First chapter','Complete your first story',profile.reads.length>=1,'▤'],['Curious mind','Finish three quizzes',profile.quizzes.length>=3,'✧'],['Sound explorer','Finish three sound patterns correctly',new Set(profile.phonics.filter(p=>p.correct).map(p=>p.id)).size>=3,'◈'],['Book wanderer','Read five different stories',new Set(profile.reads.map(r=>r.id)).size>=5,'✦'],['Steady reader','Practice on three separate days',recentDays().size>=3,'☼'],['Word collector','Save five vocabulary words',new Set(profile.savedWords).size>=5,'♢']];const logs=[...profile.quizzes.map(q=>({...q,kind:'Quiz',name:storyById(q.id)?.title||'Story',detail:`${q.correct}/${q.total} correct`})),...profile.recall.map(r=>({...r,kind:'Recall',name:'Vocabulary drill',detail:`${r.correct}/${r.total} correct`})),...profile.phonics.map(p=>({...p,kind:'Sound',name:lessonById(p.id)?.title||'Sound lesson',detail:p.correct?'Correct':'Practiced'})),...profile.reads.map(r=>({...r,kind:'Read',name:storyById(r.id)?.title||'Story',detail:'Completed'}))].sort((a,b)=>b.at-a.at).slice(0,12);return `<h1 class="page-title">Progress</h1><p class="page-subtitle">Pace, comprehension, recall, and AI weakness scan — all stored on this device only.</p>${renderAiCoach()}${metrics()}<div class="two-col" style="margin-top:21px"><section class="panel"><h3>Last 7 days</h3><p>Activities completed per day</p><div class="activity-chart" role="img" aria-label="Activity counts: ${counts.join(', ')}"><!-- bar heights are proportional to activity -->${days.map((d,i)=>`<div class="bar-group"><div class="bar" title="${counts[i]} activities" style="height:${counts[i]===0?4:Math.max(12,counts[i]/max*137)}px"></div><span>${d.toLocaleDateString(undefined,{weekday:'short'})}</span></div>`).join('')}</div><p style="margin-bottom:0">${readingMinutes()} min reading · ${wordsRead().toLocaleString()} words</p></section><section class="panel"><h3>History</h3><p>Stored only in this browser</p><div class="log-list">${logs.length?logs.map(x=>`<div class="log-row"><div><strong>${esc(x.name)}</strong><br><small>${esc(x.kind)} · ${prettyDate(x.at)}</small></div><span class="score">${esc(x.detail)}</span></div>`).join(''):'<div class="empty-state">Nothing yet. Finish a story or drill to start your log.</div>'}</div></section></div><div class="section-heading"><div><h2>Milestones</h2></div></div><div class="badge-list">${badges.map(([title,desc,yes,mark],i)=>`<div class="achievement ${yes?'earned':''}"><div class="badge-emblem" aria-hidden="true">${['★','◆','♫','✦','☀','✿'][i]}</div><strong>${esc(title)}</strong><p>${esc(desc)}</p><span class="badge-status">${yes?'Unlocked!':'Keep practicing to unlock'}</span></div>`).join('')}</div><div class="panel" style="margin-top:20px"><h3>Saved vocabulary</h3>${profile.savedWords.length?`<div class="phonics-words" style="justify-content:start">${[...new Set(profile.savedWords)].map(x=>`<span class="sound-word">${esc(x)}</span>`).join('')}</div>`:'<p>Words you look up while reading appear here.</p>'}<div class="divider"></div><button class="btn btn-outline btn-sm" data-action="export-progress">Export learning data</button></div>`}

function renderMission(){return `<h1 class="page-title">About RushRead</h1><p class="page-subtitle">RushRead is a unique way to improve reading speed, comprehension, and memory. It is an independent prototype built to make reading practice accessible, especially where literacy gaps are widest.</p><div class="mission-grid"><div class="stack"><section class="panel"><h2>Why South Dakota?</h2><p>In the 2024 NAEP reading assessment, <strong>28% of South Dakota fourth-graders</strong> scored at or above NAEP Proficient, compared with 32% in 2022. That national achievement level represents strong performance on challenging work; it should not be interpreted as the percentage who can read or as a state's grade-level proficiency rate.</p><p>South Dakota's Department of Education has introduced a statewide literacy initiative informed by the science of reading. RushRead is designed to complement—not replace—qualified instruction.</p><a class="text-link" href="https://news.sd.gov/news?id=news_kb_article_view&sys_id=1106412f97975650447ef64ef053af9f" target="_blank" rel="noopener noreferrer">State's summary of NAEP results</a></section><section class="panel"><h2>What it practices</h2><ul><li><strong>Phonemic awareness:</strong> Notice and work with sounds in spoken words (more educator-led exercises are needed).</li><li><strong>Phonics:</strong> Connect letters and patterns to sounds in the Sound Lab.</li><li><strong>Fluency:</strong> Reread, listen, and focus on sentences without pressure to rush.</li><li><strong>Vocabulary:</strong> Discover useful word meanings in context.</li><li><strong>Comprehension:</strong> Answer questions, explain your thinking, and revisit the text.</li></ul><p>These areas reflect South Dakota's English Language Arts standards. This prototype currently offers the strongest independent practice in phonics, vocabulary, and comprehension.</p></section></div><div class="stack"><div class="panel"><h3>The problem</h3><div class="mission-stat">28%</div><p>South Dakota fourth-graders at or above NAEP Proficient in reading (2024). <strong>Not</strong> a grade-level reading rate.</p></div><section class="panel"><h3>Evidence and transparency</h3><div class="source-list"><a href="https://www.nationsreportcard.gov/reports/reading/2024/g4_8/state-district-trends/" target="_blank" rel="noopener noreferrer">2024 NAEP reading state trends</a><a href="https://doe.sd.gov/assessment/NAEP.aspx" target="_blank" rel="noopener noreferrer">South Dakota Department of Education NAEP hub</a><a href="https://doe.sd.gov/contentstandards/ELA.aspx" target="_blank" rel="noopener noreferrer">South Dakota ELA standards</a></div><div class="divider"></div><h3>Important limitations</h3><p>No claim of measured learning gains, school alignment certification, formal reading assessment, or accessibility certification is made. Reading levels are approximate; speech synthesis support varies by browser.</p></section></div></div>`}
function download(name,mime,text){const blob=new Blob([text],{type:mime});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}

ss="settings-group"><label><input type="checkbox" id="pref-contrast" ${profile.prefs.contrast?'checked':''}> High-contrast story text</label></div><div class="settings-group"><label><input type="checkbox" id="pref-motion" ${profile.prefs.motion!==false?'checked':''}> Enable animations</label></div><div class="tip-box" style="margin-top:17px">Settings are saved locally and can be changed anytime.</div><button class="btn btn-primary" data-action="close-modal" style="margin-top:17px">Done</button></section></div>`}root.querySelector('button').focus()}

 else if(action==='order-pick'){ui.order.picked.push(Number(a.dataset.i));$('#content').innerHTML=renderOrder()}
 else if(action==='order-undo'){ui.order.picked.pop();$('#content').innerHTML=renderOrder()}
 else if(action==='order-check'){const o=ui.order;o.checked=true;profile.recall.push({at:Date.now(),correct:o.picked.filter((p,k)=>p===k).length,total:o.sents.length});save();$('#content').innerHTML=renderOrder()}
 else if(action==='order-new'){ui.order=makeOrder();$('#content').innerHTML=renderOrder()}
 else if(action==='speed-next'){clearSpeed();tickSpeed();if($('#speed-toggle'))$('#speed-toggle').textContent='Resume'}
 else if(action==='speed-back'){clearSpeed();ui.reader.speedIndex=Math.max(0,ui.reader.speedIndex-1);redrawReader()}
 else if(action==='finish-read'){clearSpeed();recordRead();const s=storyById(a.dataset.id);if(s?.questions?.length){ui.quiz=null;nav('quiz/'+s.id)}else{toast('Story saved.');nav('library')}}
 else if(action==='answer-recall')answerRecall(a.dataset.word);
 else if(action==='next-recall')nextRecall();
 else if(action==='new-recall'){ui.recall=makeRecall();$('#content').innerHTML=renderRecall()}
 else if(action==='answer-quiz')answerQuiz(Number(a.dataset.index));
 else if(action==='next-quiz')nextQuiz();
 else if(action==='answer-sound')answerSound(Number(a.dataset.index));
 else if(action==='retry-sound'){ui.sound.selected=null;$('#content').innerHTML=renderSound(lessonById(ui.sound.id))}
 else if(action==='pref-theme'){profile.prefs.theme=val;save();applyTheme();showModal('settings')}
 else if(action==='pref-font'){profile.prefs.font=val;save();showModal('settings');if(ui.reader)ui.reader.font=val}
 else if(action==='refresh-ai'){const panel=$('#ai-coach');if(panel){panel.classList.add('analyzing');setTimeout(()=>{panel.outerHTML=renderAiCoach(true);toast('Fresh AI scan complete.');},900+Math.random()*700)} }
 else if(action==='export-progress'){download('rushread-backup.json','application/json',JSON.stringify({app:'RushRead',version:1,exportedAt:new Date().toISOString(),profile},null,2));toast('Backup downloaded.')}
 else if(action==='export-csv'){const rows=[['date','activity','passage_or_lesson','correct','total','seconds']];for(const q of profile.quizzes)rows.push([new Date(q.at).toISOString(),'quiz',storyById(q.id)?.title||q.id,q.correct,q.total,'']);for(const r of profile.reads)rows.push([new Date(r.at).toISOString(),'read',storyById(r.id)?.title||r.id,'','',r.seconds]);for(const p of profile.phonics)rows.push([new Date(p.at).toISOString(),'sound',lessonById(p.id)?.title||p.id,p.correct?1:0,1,'']);download('rushread-progress.csv','text/csv',rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'));toast('CSV report downloaded.')}
 else if(action==='copy-story'){const v=$('#share-story')?.value||STORIES[0].id;const link=location.href.split('#')[0]+'#read/'+encodeURIComponent(v);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(link).then(()=>toast('Story link copied.'),()=>window.prompt('Copy this link:',link));else window.prompt('Copy this link:',link)}
 else if(action==='reset-data'){if(window.confirm('Erase all local RushRead activity, settings, and custom stories on this browser? This cannot be undone.')){profile=clone(initial);save();applyTheme();ui.reader=null;toast('Local RushRead data reset.');route()}}
}
function createCustom(fd){const title=String(fd.get('title')||'').trim(),text=String(fd.get('text')||'').trim(),level=Number(fd.get('level'));if(title.length<2||text.length<50||text.length>12000||![1,2,3].includes(level)){toast('Please add a title and 50–12,000 characters of story text.');return}const lines=String(fd.get('questions')||'').split('\n').map(x=>x.trim()).filter(Boolean);const questions=[];for(const line of lines){const pieces=line.split('|').map(s=>s.trim());if(pieces.length!==7||!['1','2','3','4'].includes(pieces[5])||pieces.slice(0,5).some(s=>!s)){toast('Question format: question | four choices | answer number (1–4) | explanation.');return}questions.push({q:pieces[0],choices:pieces.slice(1,5),answer:Number(pieces[5])-1,skill:'Comprehension',why:pieces[6]||'Review the passage for evidence.'})}if(questions.length>12){toast('Please add no more than 12 questions.');return}const id='custom-'+Date.now().toString(36),paras=text.split(/\n\s*\n/).map(x=>x.replace(/\s*\n\s*/g,' ').trim()).filter(Boolean);const s={id,title,level,category:'Custom',place:'Teacher-created',time:Math.max(1,Math.round(countWords(paras)/100)),symbol:'book',tint:'lavender',teaser:'A locally saved reading passage.',paragraphs:paras,vocab:{},questions};profile.customStories.push(s);save();ui.search='';ui.level='all';toast('Custom passage saved on this device.');nav('read/'+id)}
function handleSubmit(e){if(e.target.id==='name-form'||e.target.id==='welcome-name-form'){e.preventDefault();profile.name=String(new FormData(e.target).get('nickname')||'').trim().slice(0,24);save();closeModal();route();toast('Nickname saved.')}else if(e.target.id==='custom-story-form'){e.preventDefault();createCustom(new FormData(e.target))}}
function handleChange(e){if(e.target.id==='pref-motion'){profile.prefs.motion=e.target.checked;save();applyTheme()}else if(e.target.id==='pref-spacing'||e.target.id==='pref-contrast'){profile.prefs[e.target.id==='pref-spacing'?'spacing':'contrast']=e.target.checked;save();if(ui.route.startsWith('read/'))redrawReader();}
 if(e.target.id==='backup-file'){const file=e.target.files?.[0];if(!file)return;if(file.size>1024*1024){toast('Backup must be smaller than 1 MB.');return}file.text().then(raw=>{try{const obj=JSON.parse(raw);if(obj.app!=='RushRead'||!obj.profile||!Array.isArray(obj.profile.reads)||!Array.isArray(obj.profile.quizzes)||!Array.isArray(obj.profile.phonics)||!Array.isArray(obj.profile.customStories))throw Error('Invalid file');if(!window.confirm('Replace local RushRead data with this backup?'))return;profile={...clone(initial),...obj.profile,prefs:{...initial.prefs,...obj.profile.prefs},customStories:obj.profile.customStories.slice(0,50).filter(s=>s&&typeof s.id==='string'&&Array.isArray(s.paragraphs)&&Array.isArray(s.questions)&&s.paragraphs.join(' ').length<=12000)};save();ui.reader=null;toast('Backup restored.');route()}catch(err){toast('That is not a valid RushRead backup.')}}).catch(()=>toast('Could not read that file.'))}
}
function handleInput(e){if(e.target.id==='story-search'){ui.search=e.target.value;$('#story-results').innerHTML=storyResults(filteredStories())}else if(e.target.id==='speed-range'){ui.reader.wpm=Number(e.target.value);$('#wpm-label').textContent=ui.reader.wpm;if(ui.speedTimer){clearSpeed();startSpeed()}}}
window.addEventListener('hashchange',route);
document.addEventListener('click',handleClick);
document.addEventListener('submit',handleSubmit);
document.addEventListener('change',handleChange);
document.addEventListener('input',handleInput);
document.addEventListener('keydown',e=>{if(ui.route.startsWith('read/')&&ui.reader?.mode==='speed'&&!['INPUT','TEXTAREA','BUTTON','SELECT'].includes(document.activeElement.tagName)){if(e.key===' '){e.preventDefault();startSpeed()}else if(e.key==='ArrowRight'){e.preventDefault();clearSpeed();tickSpeed()}else if(e.key==='ArrowLeft'){e.preventDefault();clearSpeed();ui.reader.speedIndex=Math.max(0,ui.reader.speedIndex-1);redrawReader()}}
if(e.key==='Escape'&&$('#modal-root').children.length)closeModal();if(ui.route.startsWith('read/')&&ui.reader?.mode==='spotlight'&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){if(e.key==='ArrowRight'){e.preventDefault();ui.reader.focus=Math.min(sentences(storyById(ui.reader.id)).length-1,ui.reader.focus+1);redrawReader()}else if(e.key==='ArrowLeft'){e.preventDefault();ui.reader.focus=Math.max(0,ui.reader.focus-1);redrawReader()}}});
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-wrap'))closeModal()});

route();
})();
</script>
</body>
</html>
